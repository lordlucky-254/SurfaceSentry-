[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacesentry"
version = "0.1.0"
description = "SurfaceSentry: Automated Attack Surface Monitoring and Continuous Exposure Management"
readme = "README.md"
authors = [{ name = "SurfaceSentry Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "dnspython>=2.3.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.1.0",
]

[project.scripts]
surfacesentry = "surfacesentry.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
